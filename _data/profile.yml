short_bio_text_justify: false
short_bio: >-
  <p>I am Yuzhe Luo (罗昱哲), a fourth-year CS Ph.D. student at the
  <a href="http://www.cad.zju.edu.cn" class="profile_href">State Key Laboratory of CAD&amp;CG</a>,
  Zhejiang University, advised by Prof. <a href="http://www.cad.zju.edu.cn/home/jin/" class="profile_href">Xiaogang Jin</a>.
  I obtained my Bachelor's degree in Digital Media Technology from Zhejiang University in 2022.
  </p>
  <p>
  From Feb. 2023 to May 2026, I worked as a research intern at
  <a href="https://www.lightspeedstudios.com/" class="profile_href">Lightspeed Studio</a>
  collaborating with <a href="https://gaoxifeng.github.io/" class="profile_href">Xifeng Gao</a>,
  <a href="https://dyingbrain.github.io/" class="profile_href">Zherong Pan</a>,
  and <a href="https://kuiwuchn.github.io/" class="profile_href">Kui Wu</a>,
  focusing on 3D asset processing and generation research.
  Since May 2026, I have joined the team led by <a href="https://hzykent.github.io/" class="profile_href">Zeyu Hu</a>,
  working on game world model research.
  </p>
  <p><b>Research Interest:</b> Gaming-oriented 3D assets processing and generation algorithms.</p>
  <p><b>Job Hunting:</b> I am looking for full-time opportunities in 2027. If you are interested, please feel free to contact me!</p>

